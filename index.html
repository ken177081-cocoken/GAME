<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海戰棋 雙人對戰</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="海戰棋">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#eef3f7; --panel:#ffffff; --text:#1b2733; --muted:#6a7b8c; --line:#d5dfe8;
  --water:#cfe3f2; --water-hover:#b4d3ea; --ship:#5b6b7a; --hit:#e0483e; --miss:#8fa9bd;
  --sunk:#7a1f1a; --accent:#1f6fb2; --accent-text:#fff; --ok:#3aa76d; --bad:#e0483e; --sel:#f0a020;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1720; --panel:#17222e; --text:#e3ebf2; --muted:#8fa2b4; --line:#2a3a4a;
    --water:#1d3a55; --water-hover:#285074; --ship:#8a9bab; --hit:#ff5a4e; --miss:#4c6a84;
    --sunk:#b3322a; --accent:#4b9be0; --accent-text:#0b1520; --ok:#4cc488; --bad:#ff5a4e; --sel:#f5b23d;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1720; --panel:#17222e; --text:#e3ebf2; --muted:#8fa2b4; --line:#2a3a4a;
  --water:#1d3a55; --water-hover:#285074; --ship:#8a9bab; --hit:#ff5a4e; --miss:#4c6a84;
  --sunk:#b3322a; --accent:#4b9be0; --accent-text:#0b1520; --ok:#4cc488; --bad:#ff5a4e; --sel:#f5b23d;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.5}
header{text-align:center;padding:20px 16px 4px}
header h1{margin:0;font-size:26px;letter-spacing:2px}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
main{max-width:980px;margin:0 auto;padding:12px 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:460px;margin:16px auto}
.center{text-align:center}
h2{margin:0 0 6px;font-size:20px}
h3{margin:0 0 8px;font-size:15px;color:var(--muted);font-weight:600}
label.row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:14px}
input[type=text],select{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
label.chk{display:flex;gap:10px;align-items:center;font-size:15px;margin:6px 0;min-height:40px;cursor:pointer}
label.chk input{width:22px;height:22px;flex:none}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{min-height:46px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.layout{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;justify-content:center}
.side{flex:1 1 240px;max-width:320px;display:flex;flex-direction:column;gap:12px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btns .btn{padding:10px 6px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;width:min(100%,520px,max(300px,calc(100dvh - 200px)));user-select:none;-webkit-user-select:none;touch-action:manipulation}
.cell.aim{box-shadow:inset 0 0 0 3px var(--sel);background:var(--water-hover)}
.firebar{display:flex;gap:8px;justify-content:center;margin-top:12px;min-height:46px}
.firebar .btn{flex:0 1 280px}
@media (max-width:720px){
  main{padding:8px 12px 32px}
  header{padding:14px 12px 0}
  header h1{font-size:22px}
  .side{max-width:none;width:min(100%,520px)}
  .ships{flex-direction:row!important;flex-wrap:wrap}
  .shipbtn{flex:1 1 calc(50% - 6px)}
  .boards{gap:18px}
  .grid .lbl{font-size:11px}
  .firebar{position:sticky;bottom:0;padding:8px 0;background:var(--bg);z-index:2}
  .firebar .btn{flex:1 1 auto}
}
.grid .lbl{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.cell{aspect-ratio:1;border:none;padding:0;background:var(--water);border-radius:3px;position:relative;min-width:0}
.cell.ship{background:var(--ship)}
.cell.selected{box-shadow:inset 0 0 0 2px var(--sel)}
.cell.pv-ok{background:var(--ok)}
.cell.pv-bad{background:var(--bad);opacity:.7}
.cell.miss::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--miss)}
.cell.hit{background:var(--hit)}
.cell.hit::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:clamp(10px,2.4vw,16px)}
.cell.sunk{background:var(--sunk)}
.fire .cell:not(.hit):not(.miss):hover{background:var(--water-hover)}
.fire.locked .cell{cursor:default}
.fire.locked .cell:hover{background:var(--water)}
.ships{display:flex;flex-direction:column;gap:6px}
.shipbtn{min-height:48px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-align:left}
.shipbtn.active{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.shipbtn .st{font-size:12px;color:var(--muted)}
.blocks{display:flex;gap:2px}
.blocks i{width:10px;height:10px;border-radius:2px;background:var(--ship);display:block}
.blocks i.h{background:var(--hit)}
.turnbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.turnbar strong{font-size:17px}
#shot-msg{font-weight:600;flex-basis:100%}
.btn.small{min-height:40px;padding:6px 12px;font-size:14px}
.tb-actions{display:flex;gap:8px}
.btns2{display:flex;gap:8px}
.btns2 .btn{flex:1}
#shot-msg.hit{color:var(--hit)}
#shot-msg.miss{color:var(--muted)}
.boards{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
.boards>div{flex:1 1 320px;max-width:520px;display:flex;flex-direction:column;align-items:center}
.boards h3,.boards .fleet{align-self:stretch}
.fleet{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:13px}
.fleet span{display:flex;align-items:center;gap:5px}
.fleet .dead{text-decoration:line-through;color:var(--muted)}
.actions{text-align:center;margin-top:18px}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:12px;color:var(--muted);margin-top:14px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.stats{color:var(--muted);font-size:14px;margin-bottom:16px}
</style>
</head>
<body>
<header>
  <h1>海戰棋</h1>
  <p>雙人同機對戰・輪流使用同一台裝置</p>
</header>
<main>

<!-- 設定 -->
<section id="s-setup" class="screen">
  <div class="card" id="resume-card" hidden>
    <h2>有一局尚未結束</h2>
    <p id="resume-info" class="hint"></p>
    <div class="btns2">
      <button class="btn primary" id="btn-resume">繼續對局</button>
      <button class="btn" id="btn-discard">捨棄這局</button>
    </div>
  </div>
  <div class="card">
    <h2>開始新局</h2>
    <p class="hint">兩人先後祕密佈陣，再輪流開火。換人時會出現遮蔽畫面，請把裝置交給對方再按開始。</p>
    <label class="row">玩家一名稱<input type="text" id="n1" value="玩家一" maxlength="12"></label>
    <label class="row">玩家二名稱<input type="text" id="n2" value="玩家二" maxlength="12"></label>
    <label class="row">棋盤大小
      <select id="opt-size">
        <option value="10" selected>10 × 10（標準）</option>
        <option value="9">9 × 9</option>
        <option value="8">8 × 8</option>
        <option value="7">7 × 7</option>
        <option value="6">6 × 6（快速局）</option>
      </select>
    </label>
    <p class="hint" id="fleet-info" style="margin-top:-6px"></p>
    <label class="chk"><input type="checkbox" id="opt-noadj">船艦之間不可相鄰（含斜角）</label>
    <label class="chk"><input type="checkbox" id="opt-chain" checked>命中後可以再開一砲</label>
    <div class="actions"><button class="btn primary" id="btn-start">開始佈陣</button></div>
  </div>
</section>

<!-- 佈陣 -->
<section id="s-place" class="screen" hidden>
  <h2 id="place-title" class="center"></h2>
  <p class="hint center" id="place-hint"></p>
  <div class="layout">
    <div id="place-grid" class="grid"></div>
    <div class="side">
      <div id="ship-list" class="ships"></div>
      <div class="btns">
        <button class="btn" id="btn-rotate">方向：橫向</button>
        <button class="btn" id="btn-random">隨機擺放</button>
        <button class="btn" id="btn-clear">全部清除</button>
      </div>
      <button class="btn" id="btn-confirm" hidden>確認放置</button>
      <button class="btn primary" id="btn-ready" disabled>完成佈陣</button>
      <button class="btn small" id="btn-pause-place">暫停離開（保留進度）</button>
    </div>
  </div>
</section>

<!-- 換人遮蔽 -->
<section id="s-pass" class="screen" hidden>
  <div class="card center">
    <h2 id="pass-title"></h2>
    <p id="pass-msg" class="hint"></p>
    <button class="btn primary" id="btn-pass"></button>
  </div>
</section>

<!-- 對戰 -->
<section id="s-battle" class="screen" hidden>
  <div class="turnbar">
    <strong id="turn-title"></strong>
    <div class="tb-actions">
      <button class="btn small" id="btn-pause">暫停離開</button>
      <button class="btn small" id="btn-surrender">投降</button>
    </div>
    <span id="shot-msg"></span>
  </div>
  <div class="boards">
    <div>
      <h3>敵方海域（點擊格子開火）</h3>
      <div id="enemy-grid" class="grid fire"></div>
      <div class="firebar" style="align-self:stretch">
        <button class="btn primary" id="btn-fire" hidden>開火</button>
        <button class="btn primary" id="btn-end" hidden>結束回合，交給對手</button>
      </div>
      <div id="enemy-fleet" class="fleet"></div>
    </div>
    <div>
      <h3>我方艦隊</h3>
      <div id="own-grid" class="grid"></div>
      <div id="own-fleet" class="fleet"></div>
    </div>
  </div>
  <div class="legend">
    <span><i style="background:var(--ship)"></i>船艦</span>
    <span><i style="background:var(--hit)"></i>命中</span>
    <span><i style="background:var(--sunk)"></i>已擊沉</span>
    <span><i style="background:var(--miss);border-radius:50%"></i>落空</span>
  </div>
</section>

<!-- 結束 -->
<section id="s-over" class="screen" hidden>
  <div class="center">
    <h2 id="over-title"></h2>
    <p id="over-stats" class="stats"></p>
  </div>
  <div class="boards">
    <div><h3 id="over-n0"></h3><div id="over-g0" class="grid"></div></div>
    <div><h3 id="over-n1"></h3><div id="over-g1" class="grid"></div></div>
  </div>
  <div class="actions"><button class="btn primary" id="btn-again">再玩一局</button></div>
</section>

</main>
<script>
let N = 10;
const L = 'ABCDEFGHIJ';
// 各棋盤大小的艦隊配置（船艦格數約佔棋盤 16%–20%）
const S = {
  car:{name:'航空母艦', size:5}, bat:{name:'戰艦', size:4}, cru:{name:'巡洋艦', size:3},
  sub:{name:'潛艇', size:3}, des:{name:'驅逐艦', size:2}, pat:{name:'巡邏艇', size:2}
};
const FLEETS = {
  10:[S.car, S.bat, S.cru, S.sub, S.des],
  9: [S.bat, S.cru, S.sub, S.des, S.pat],
  8: [S.bat, S.cru, S.des, S.pat],
  7: [S.bat, S.cru, S.des],
  6: [S.cru, S.des, S.pat]
};
const fleetText = n => FLEETS[n].map(s => `${s.name}${s.size}`).join('、') +
  `（共 ${FLEETS[n].length} 艘、${FLEETS[n].reduce((a, s) => a + s.size, 0)} 格）`;
const $ = id => document.getElementById(id);
const rand = n => Math.floor(Math.random() * n);
const grid = v => Array.from({length:N}, () => Array(N).fill(v));
const coord = (r, c) => L[c] + (r + 1);

let cfg = {noAdj:false, chain:false};
let P = [], placeIdx = 0, sel = 0, horiz = true, hover = null;
let cp = 0, locked = false, lastShots = [], phase = 'setup', aim = null;
// 觸控裝置：點一下預覽／瞄準，再點一次確認；滑鼠：直接點擊即執行
let pointer = matchMedia('(pointer: coarse)').matches ? 'touch' : 'mouse';
document.addEventListener('pointerdown', e => { pointer = e.pointerType === 'mouse' ? 'mouse' : 'touch'; }, true);
const isTouch = () => pointer === 'touch';
const same = (a, r, c) => a && a[0] === r && a[1] === c;

/* ---------- 中離存檔（存在這台裝置的瀏覽器裡） ---------- */
const KEY = 'battleship-hotseat-v1';
let handoffMsg = '';
function save(stage){
  try { localStorage.setItem(KEY, JSON.stringify({P, cfg, cp, placeIdx, stage, locked, lastShots, handoffMsg, t:Date.now()})); } catch(e){}
}
function loadSave(){ try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function clearSave(){ try { localStorage.removeItem(KEY); } catch(e){} }
function refreshResume(){
  const s = loadSave();
  $('resume-card').hidden = !s;
  if (!s) return;
  const when = new Date(s.t).toLocaleString('zh-TW', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
  const next = s.stage === 'battle' ? s.P[s.locked ? 1 - s.cp : s.cp].name : s.P[s.placeIdx].name;
  const sz = (s.cfg && s.cfg.size) || 10;
  $('resume-info').textContent = `${s.P[0].name} vs ${s.P[1].name}・${sz}×${sz}・${s.stage === 'battle' ? '對戰中' : '佈陣中'}，輪到 ${next}（${when} 存檔）`;
}
function resume(){
  const s = loadSave(); if (!s) return;
  P = s.P; cfg = s.cfg; cp = s.cp; placeIdx = s.placeIdx; handoffMsg = s.handoffMsg || '';
  N = cfg.size || 10; rebuildGrids();
  if (s.stage === 'place'){
    showPass(`請把裝置交給 ${P[placeIdx].name}`, '繼續上次的佈陣。', `我是 ${P[placeIdx].name}，繼續佈陣`, () => startPlace(placeIdx));
  } else {
    if (s.locked){ cp = 1 - cp; handoffMsg = `${P[1 - cp].name} 上回合：${(s.lastShots || []).join('、')}`; }
    locked = false; save('battle');
    showPass(`請把裝置交給 ${P[cp].name}`, handoffMsg || '繼續對局。', `我是 ${P[cp].name}，開始回合`, startTurn);
  }
}
function pauseGame(){ phase = 'setup'; refreshResume(); show('s-setup'); }

function newPlayer(name){
  return {name, board:grid(-1), inc:grid(0), shots:0, hits:0,
    ships:FLEETS[N].map(s => ({...s, cells:[], hits:0, placed:false}))};
}

/* ---------- 擺放邏輯 ---------- */
function cellsFor(size, r, c, h){
  const a = [];
  for (let i = 0; i < size; i++) a.push(h ? [r, c + i] : [r + i, c]);
  return a;
}
function inB(y, x){ return y >= 0 && y < N && x >= 0 && x < N; }
function canPlace(p, si, r, c, h){
  for (const [y, x] of cellsFor(p.ships[si].size, r, c, h)){
    if (!inB(y, x)) return false;
    const o = p.board[y][x];
    if (o !== -1 && o !== si) return false;
    if (cfg.noAdj){
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
        const yy = y + dy, xx = x + dx;
        if (!inB(yy, xx)) continue;
        const o2 = p.board[yy][xx];
        if (o2 !== -1 && o2 !== si) return false;
      }
    }
  }
  return true;
}
function removeShip(p, si){
  const s = p.ships[si];
  s.cells.forEach(([y, x]) => p.board[y][x] = -1);
  s.cells = []; s.placed = false;
}
function place(p, si, r, c, h){
  removeShip(p, si);
  const s = p.ships[si];
  s.cells = cellsFor(s.size, r, c, h);
  s.cells.forEach(([y, x]) => p.board[y][x] = si);
  s.placed = true;
}
function randomPlace(p){
  for (let t = 0; t < 300; t++){
    p.board = grid(-1);
    p.ships.forEach(s => { s.cells = []; s.placed = false; });
    let ok = true;
    for (let si = 0; si < p.ships.length && ok; si++){
      let done = false;
      for (let k = 0; k < 500; k++){
        const h = Math.random() < .5, r = rand(N), c = rand(N);
        if (canPlace(p, si, r, c, h)){ place(p, si, r, c, h); done = true; break; }
      }
      if (!done) ok = false;
    }
    if (ok) return;
  }
}

/* ---------- 棋盤建構 ---------- */
function buildGrid(el, h = {}){
  el.innerHTML = '';
  el._cells = grid(null);
  el.style.gridTemplateColumns = `repeat(${N + 1}, 1fr)`;
  const corner = document.createElement('div'); corner.className = 'lbl'; el.appendChild(corner);
  for (let c = 0; c < N; c++){ const d = document.createElement('div'); d.className = 'lbl'; d.textContent = L[c]; el.appendChild(d); }
  for (let r = 0; r < N; r++){
    const d = document.createElement('div'); d.className = 'lbl'; d.textContent = r + 1; el.appendChild(d);
    for (let c = 0; c < N; c++){
      const b = document.createElement('button');
      b.className = 'cell'; b.setAttribute('aria-label', coord(r, c));
      if (h.click) b.addEventListener('click', () => h.click(r, c));
      if (h.enter) b.addEventListener('mouseenter', () => h.enter(r, c));
      el._cells[r][c] = b; el.appendChild(b);
    }
  }
  el.onmouseleave = h.leave || null;
}

function show(id){ document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== id); window.scrollTo(0, 0); }

function showPass(title, msg, btn, next){
  $('pass-title').textContent = title;
  $('pass-msg').textContent = msg;
  $('btn-pass').textContent = btn;
  $('btn-pass').onclick = next;
  show('s-pass');
}

/* ---------- 佈陣畫面 ---------- */
function startPlace(i){
  phase = 'place'; placeIdx = i; sel = nextUnplaced(P[i]); horiz = true; hover = null;
  $('place-title').textContent = `${P[i].name}：佈置你的艦隊`;
  $('place-hint').textContent = isTouch()
    ? '選一艘船，點格子預覽位置（點擊格為船頭），再點一次或按「確認放置」放下。點已放好的船可拿起重放。'
    : '選一艘船，點格子放置（點擊格為船頭）。點已放好的船可拿起重放。按 R 鍵或「旋轉」切換方向。';
  updateRotateBtn();
  paintPlace();
  show('s-place');
}
function nextUnplaced(p){ const i = p.ships.findIndex(s => !s.placed); return i === -1 ? null : i; }
function updateRotateBtn(){ $('btn-rotate').textContent = '方向：' + (horiz ? '橫向' : '直向'); }

function paintPlace(){
  const p = P[placeIdx], g = $('place-grid');
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const o = p.board[r][c];
    let cls = 'cell';
    if (o !== -1){ cls += ' ship'; if (o === sel) cls += ' selected'; }
    g._cells[r][c].className = cls;
  }
  if (hover && sel !== null){
    const [hr, hc] = hover;
    const ok = canPlace(p, sel, hr, hc, horiz);
    for (const [y, x] of cellsFor(p.ships[sel].size, hr, hc, horiz))
      if (inB(y, x)) g._cells[y][x].classList.add(ok ? 'pv-ok' : 'pv-bad');
  }
  const list = $('ship-list'); list.innerHTML = '';
  p.ships.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'shipbtn' + (i === sel ? ' active' : '');
    b.innerHTML = `<span>${s.name}<br><span class="st">${s.size} 格・${s.placed ? '已放置' : '未放置'}</span></span>
      <span class="blocks">${'<i></i>'.repeat(s.size)}</span>`;
    b.onclick = () => { sel = i; paintPlace(); };
    list.appendChild(b);
  });
  $('btn-ready').disabled = p.ships.some(s => !s.placed);
  const showConfirm = isTouch() && hover && sel !== null;
  $('btn-confirm').hidden = !showConfirm;
  if (showConfirm) $('btn-confirm').disabled = !canPlace(p, sel, hover[0], hover[1], horiz);
  save('place');
}

function placeClick(r, c){
  const p = P[placeIdx], o = p.board[r][c];
  if (o !== -1 && o !== sel){           // 點到其他已放的船 → 拿起來
    const s = p.ships[o];
    horiz = s.cells.length > 1 ? s.cells[0][0] === s.cells[1][0] : horiz;
    removeShip(p, o); sel = o; hover = null; updateRotateBtn(); paintPlace(); return;
  }
  if (sel === null) return;
  if (isTouch() && !same(hover, r, c)){ hover = [r, c]; paintPlace(); return; }
  commitPlace(r, c);
}
function commitPlace(r, c){
  const p = P[placeIdx];
  if (sel === null || !canPlace(p, sel, r, c, horiz)) return;
  place(p, sel, r, c, horiz);
  sel = nextUnplaced(p);
  if (isTouch()) hover = null;
  paintPlace();
}

/* ---------- 對戰畫面 ---------- */
function startTurn(){
  phase = 'battle'; locked = false; lastShots = []; aim = null;
  $('btn-fire').hidden = true;
  save('battle');
  $('turn-title').textContent = `${P[cp].name} 的回合・${cfg.chain ? '命中可連開' : '每回合一砲'}`;
  setMsg('請選擇開火位置', '');
  $('btn-end').hidden = true;
  paintBattle();
  show('s-battle');
}
function setMsg(t, cls){ const m = $('shot-msg'); m.textContent = t; m.className = cls; }

function paintBoard(g, p, revealShips){
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const si = p.board[r][c], inc = p.inc[r][c];
    let cls = 'cell';
    if (revealShips && si !== -1) cls += ' ship';
    if (inc === 1) cls += ' miss';
    if (inc === 2){ cls += ' hit'; if (p.ships[si].hits === p.ships[si].size) cls += ' sunk'; }
    g._cells[r][c].className = cls;
  }
}
function paintFleet(el, p, showHits){
  el.innerHTML = p.ships.map(s => {
    const dead = s.hits === s.size;
    const blocks = showHits
      ? Array.from({length:s.size}, (_, i) => `<i class="${s.cells[i] && p.inc[s.cells[i][0]][s.cells[i][1]] === 2 ? 'h' : ''}"></i>`).join('')
      : '<i></i>'.repeat(s.size);
    return `<span class="${dead ? 'dead' : ''}">${s.name}<span class="blocks">${blocks}</span></span>`;
  }).join('');
}
function paintBattle(){
  const me = P[cp], op = P[1 - cp];
  paintBoard($('enemy-grid'), op, false);
  paintBoard($('own-grid'), me, true);
  $('enemy-grid').classList.toggle('locked', locked);
  if (aim && !locked) $('enemy-grid')._cells[aim[0]][aim[1]].classList.add('aim');
  paintFleet($('enemy-fleet'), op, false);
  paintFleet($('own-fleet'), me, true);
}

function fire(r, c){
  if (phase !== 'battle' || locked) return;
  if (P[1 - cp].inc[r][c]) return;
  if (isTouch() && !same(aim, r, c)){
    aim = [r, c];
    $('btn-fire').textContent = `開火 ${coord(r, c)}`;
    $('btn-fire').hidden = false;
    setMsg(`已瞄準 ${coord(r, c)}，再點一次或按「開火」`, '');
    paintBattle(); return;
  }
  doFire(r, c);
}
function doFire(r, c){
  if (phase !== 'battle' || locked) return;
  const me = P[cp], op = P[1 - cp];
  if (op.inc[r][c]) return;
  aim = null; $('btn-fire').hidden = true;
  me.shots++;
  const si = op.board[r][c], k = coord(r, c);
  if (si === -1){
    op.inc[r][c] = 1;
    setMsg(`${k}：落空`, 'miss'); lastShots.push(`${k} 落空`);
    locked = true;
  } else {
    op.inc[r][c] = 2; me.hits++;
    const s = op.ships[si]; s.hits++;
    if (s.hits === s.size){ setMsg(`${k}：命中，擊沉${s.name}！`, 'hit'); lastShots.push(`${k} 擊沉${s.name}`); }
    else { setMsg(`${k}：命中！`, 'hit'); lastShots.push(`${k} 命中`); }
    if (op.ships.every(x => x.hits === x.size)){
      locked = true; phase = 'over'; paintBattle();
      setTimeout(() => gameOver(cp), 900); return;
    }
    locked = !cfg.chain;
    if (!locked) setMsg($('shot-msg').textContent + (isTouch() ? ' 請再選一格繼續開火' : ' 請再點一格繼續開火'), 'hit');
  }
  paintBattle();
  $('btn-end').hidden = !locked;
  save('battle');
}

function endTurn(){
  handoffMsg = `${P[cp].name} 上回合：${lastShots.join('、')}`;
  cp = 1 - cp; locked = false;
  save('battle');
  showPass(`請把裝置交給 ${P[cp].name}`, handoffMsg, `我是 ${P[cp].name}，開始回合`, startTurn);
}

function gameOver(w, reason){
  clearSave(); phase = 'over';
  const win = P[w];
  $('over-title').textContent = `${win.name} 獲勝！`;
  const rate = p => p.shots ? Math.round(p.hits / p.shots * 100) : 0;
  $('over-stats').textContent = (reason ? reason + '。　' : '') + P.map(p => `${p.name}：開火 ${p.shots} 次，命中率 ${rate(p)}%`).join('　｜　');
  [0, 1].forEach(i => {
    $('over-n' + i).textContent = `${P[i].name} 的艦隊`;
    paintBoard($('over-g' + i), P[i], true);
  });
  show('s-over');
}

/* ---------- 綁定 ---------- */
function rebuildGrids(){
  buildGrid($('place-grid'), {
    click: placeClick,
    enter: (r, c) => { if (isTouch()) return; hover = [r, c]; paintPlace(); },
    leave: () => { if (isTouch()) return; hover = null; paintPlace(); }
  });
  buildGrid($('enemy-grid'), {click: fire});
  buildGrid($('own-grid'));
  buildGrid($('over-g0'));
  buildGrid($('over-g1'));
}
rebuildGrids();
$('btn-confirm').onclick = () => { if (hover) commitPlace(hover[0], hover[1]); };
$('btn-fire').onclick = () => { if (aim) doFire(aim[0], aim[1]); };
const updateFleetInfo = () => { $('fleet-info').textContent = '艦隊：' + fleetText(+$('opt-size').value); };
$('opt-size').onchange = updateFleetInfo;
updateFleetInfo();

$('btn-start').onclick = () => {
  if (loadSave() && !confirm('開新局會覆蓋尚未結束的那一局，確定嗎？')) return;
  clearSave();
  cfg.noAdj = $('opt-noadj').checked;
  cfg.chain = $('opt-chain').checked;
  cfg.size = N = +$('opt-size').value;
  rebuildGrids();
  P = [newPlayer($('n1').value.trim() || '玩家一'), newPlayer($('n2').value.trim() || '玩家二')];
  showPass(`請把裝置交給 ${P[0].name}`, '另一位玩家請勿偷看。', `我是 ${P[0].name}，開始佈陣`, () => startPlace(0));
};
$('btn-rotate').onclick = () => { horiz = !horiz; updateRotateBtn(); paintPlace(); };
$('btn-random').onclick = () => { randomPlace(P[placeIdx]); sel = null; paintPlace(); };
$('btn-clear').onclick = () => { P[placeIdx].board = grid(-1); P[placeIdx].ships.forEach(s => { s.cells = []; s.placed = false; }); sel = 0; paintPlace(); };
$('btn-ready').onclick = () => {
  if (placeIdx === 0){
    showPass(`請把裝置交給 ${P[1].name}`, `${P[0].name} 已完成佈陣。`, `我是 ${P[1].name}，開始佈陣`, () => startPlace(1));
  } else {
    cp = 0; locked = false; handoffMsg = ''; phase = 'battle';
    save('battle');
    showPass(`雙方佈陣完成，請把裝置交給 ${P[0].name}`, `${P[0].name} 先攻。`, `我是 ${P[0].name}，開始回合`, startTurn);
  }
};
$('btn-end').onclick = endTurn;
$('btn-again').onclick = () => { phase = 'setup'; refreshResume(); show('s-setup'); };
$('btn-pause').onclick = pauseGame;
$('btn-pause-place').onclick = pauseGame;
$('btn-surrender').onclick = () => {
  if (phase !== 'battle') return;
  if (!confirm(`${P[cp].name} 確定要投降嗎？對局會直接結束。`)) return;
  gameOver(1 - cp, `${P[cp].name} 投降`);
};
$('btn-resume').onclick = resume;
$('btn-discard').onclick = () => {
  if (!confirm('確定捨棄這局？捨棄後無法復原。')) return;
  clearSave(); refreshResume();
};
refreshResume();
document.addEventListener('keydown', e => {
  if (phase === 'place' && (e.key === 'r' || e.key === 'R') && document.activeElement.tagName !== 'INPUT'){
    horiz = !horiz; updateRotateBtn(); paintPlace();
  }
});
</script>
</body>
</html>
